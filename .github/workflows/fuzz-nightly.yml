name: Fuzz (nightly)

# Actually *runs* the parse_registry_ref fuzz target with a real time budget.
# ci.yml's own "cargo check fuzz/" step (see its "fuzz/ is its own crate..."
# comment) only compiles the fuzz/ crate on every push/PR; it deliberately
# does not run cargo-fuzz because that needs a nightly toolchain the main
# workflow never installs. This workflow supplies that nightly toolchain and
# does the actual fuzzing, on a schedule rather than per-push/PR: a fuzz run
# with any meaningful time budget is too slow to gate every push, and its
# value is in finding new crashes over time, not blocking a specific commit.
on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  # Lets a human kick off a run on demand (e.g. right after touching the
  # parser) without waiting for the nightly schedule.
  workflow_dispatch:

# Read-only: this workflow never commits or pushes anything back to the
# repo (see the "On failure" comment below on why not), so it needs nothing
# beyond checking out the source. Same default as ci.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz parse_registry_ref
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # cargo-fuzz's libfuzzer-sys backend needs nightly (sanitizer/coverage
      # instrumentation flags are unstable), unlike every other Rust step in
      # ci.yml, which builds and tests entirely on stable.
      - name: Set up Rust (nightly)
        # Same commit ci.yml pins for its stable installs; the action itself
        # is toolchain-agnostic, `with: toolchain: nightly` below is what
        # actually selects nightly here.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # Run from the repo root, not fuzz/: cargo-fuzz auto-discovers the
      # fuzz/ subdirectory from the workspace root, and running it from
      # there keeps this step identical to what a developer runs locally.
      # -max_total_time bounds the run to 5 minutes so a stuck or
      # slow-to-converge fuzz run can't hang the nightly job indefinitely.
      - name: Run cargo-fuzz
        run: cargo +nightly fuzz run parse_registry_ref -- -max_total_time=300

      # On failure, cargo-fuzz has already written the crashing input(s) to
      # fuzz/artifacts/parse_registry_ref/. Automatically committing those
      # back into fuzz/corpus/ as new regression seeds is a deliberate
      # future follow-up, gated on choosing a bot-commit mechanism: this
      # repo has no bot PAT or GitHub App token configured anywhere, no
      # dependabot.yml, and no other scheduled workflow that writes back to
      # the repo (the only other CI job that writes anything, `release` in
      # ci.yml, only creates GitHub Releases via softprops/action-gh-release,
      # never git commit/push). Until one of those exists (a bot PAT, a
      # GitHub App token, or a peter-evans/create-pull-request-style
      # PR-based flow), this job just uploads the crash artifact and fails
      # naturally, so a human gets the normal failed-scheduled-workflow
      # GitHub notification and can triage and add the seed by hand.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parse_registry_ref-crash-artifacts
          path: fuzz/artifacts/parse_registry_ref/
          if-no-files-found: ignore

      # Always uploaded, success or failure: cargo-fuzz grows the corpus
      # in-place with any new input that increases coverage, even when no
      # crash occurs. Uploading it as a build artifact makes that growth
      # inspectable without ever committing it anywhere (see the comment
      # above on why this workflow makes no repo writes at all).
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parse_registry_ref-corpus
          path: fuzz/corpus/parse_registry_ref/
          if-no-files-found: error
