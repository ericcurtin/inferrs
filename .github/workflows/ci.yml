name: CI

# No `tags:` trigger: every commit on main is a release, and the `release`
# job creates the v<version> tag itself (see packaging/version.sh).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Workflow-wide default: read-only. Every job here only needs to check
# out and build/test the repo except `release`, which needs to create a
# GitHub Release — that one job overrides this with its own
# `permissions: contents: write` (see the release job below) rather than
# every job inheriting broad default repo permissions for no reason.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The single place to bump when a newer llama.cpp release is needed —
  # every matrix.llama-asset entry below (e2e job) is just this release's
  # OS/arch-specific asset suffix (e.g. "ubuntu-x64.tar.gz"), combined
  # with this value at the "Install llama-server" step's own point of use
  # ("llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}") rather
  # than each duplicating the full "llama-<release>-bin-..." filename
  # independently.
  LLAMA_CPP_RELEASE: b10293
  # vLLM version the e2e job's "Install vLLM (e2e)" step installs, for
  # vllm-plugin/tests/test_e2e.py's real `vllm serve` test. Moves with
  # VLLM_METAL_VERSION below: a vllm-metal release names the vLLM
  # release it was built against in its `.github/vllm-release-tag.commit`.
  VLLM_VERSION: "0.28.0"
  # vllm-metal (github.com/vllm-project/vllm-metal), macOS's Metal-GPU
  # vLLM platform below. A stable release, cut from its `releases/vX.Y.Z`
  # branch and numbered after the vLLM release it pairs with — never a
  # `.dev` prerelease: those are published on every merge to its main
  # and each one deletes the previous (vllm-metal#662), so a pinned one
  # 404s within hours. The 0.3.0.dev20260825040033 pinned here before
  # went that way and took every macOS e2e run with it. Bump deliberately.
  VLLM_METAL_VERSION: "0.28.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Every leg finishes in 2-7 min warm, so 60 is pure headroom — it
    # exists only to bound a wedged runner. CI 33613527281's
    # ubuntu-24.04-arm leg lost communication with the server mid-build
    # and, with no timeout here, stalled 46 min before GitHub's own
    # infrastructure gave up, blocking `release` (which `needs:` this)
    # the whole time. A timeout can't keep a runner alive, just stop a
    # dead one from stalling until the 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            binary: llmman

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            binary: llmman

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            binary: llmman

          # ── Windows x86_64 ────────────────────────────────────────────────
          # No linker override; build.rs repacks the Go archive and strips
          # its SEH sections so the default MSVC link.exe works (see it for
          # the LNK1223/LNK4003 detail). Empty deliberately, not as
          # belt-and-braces: an override would hide a regression in that
          # path, and this leg is the only thing exercising it.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            binary: llmman.exe
            msvc-arch: amd64
            rustflags: ""

          # ── Windows aarch64 ───────────────────────────────────────────────
          # ARM64 uses the MSVC-native link.exe (put first in PATH by
          # ilammy/msvc-dev-cmd) rather than lld-link: the lld-link in
          # C:\Program Files\LLVM\bin on the ARM64 runner is an x86_64
          # binary running under emulation; it opens ARM64 archives but
          # silently ignores ARM64 COFF objects (machine type mismatch),
          # reporting every CGO export as an undefined symbol.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            binary: llmman.exe
            msvc-arch: arm64
            rustflags: ""

    steps:
      # fetch-depth: 0 — packaging/version.sh needs the full commit count.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Writes MAJOR.MINOR.<commit count> into Cargo.toml/Cargo.lock before
      # compiling, so `llmman --version`, the release tag, the crate and
      # the brew/winget packages all carry the same version. Runs on PRs
      # too, so a broken script fails before it can ship. That edit would
      # make build.rs's `git describe --dirty` report -dirty, so the commit
      # hash is passed explicitly instead.
      - name: Set release version
        shell: bash
        run: |
          packaging/version.sh --apply
          echo "LLMMAN_GIT_DESCRIBE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # ── Go toolchain ──────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      # The version step changes Cargo.lock every commit, so rust-cache
      # never gets an exact key hit; its prefix fallback still restores
      # all dependency artefacts.
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      # ── Windows: set up MSVC with the correct target architecture ─────────
      # msvc-arch is explicit in the matrix so the ARM64 runner gets the ARM64
      # toolchain rather than the default x64, which would cause the wrong
      # assembler to be used when CGO compiles Go's ARM64 runtime stubs.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) ─────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # ── Diagnostics: show which C/linker tools will be used (Windows) ───────
      - name: Show Windows toolchain info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== clang ===" ; where.exe clang ; clang --version 2>&1 | Select-Object -First 1
          Write-Host "=== lld-link ===" ; where.exe lld-link 2>&1 ; (Get-Command lld-link -ErrorAction SilentlyContinue)?.Source
          Write-Host "=== link ===" ; where.exe link 2>&1 | Select-Object -First 1

      # ── Build (Docker backend, default) ───────────────────────────────────
      - name: Build (docker backend)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Both builds share an output path (same package, same triple, only
      # feature flags differ), so the podman build below overwrites this
      # one — which shipped every non-Windows release asset as a podman
      # binary labelled as docker. Copy it out of reach first.
      - name: Stage docker binary
        shell: bash
        run: |
          mkdir -p dist-docker
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist-docker/${{ matrix.binary }}"

      # ── Build (Podman backend) ────────────────────────────────────────────
      # Skipped on Windows: containers/image has no Windows support.
      - name: Build (podman backend)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features podman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Fail rather than ship a mislabelled binary if those paths ever
      # collide again. Go embeds each function's source path, and the two
      # backends' build tags are mutually exclusive, so this checks the
      # artifact itself rather than the flags meant to build it.
      # grep -a, not strings(1): Git Bash on Windows ships no strings.
      - name: Verify staged binary is the docker backend
        shell: bash
        run: |
          bin="dist-docker/${{ matrix.binary }}"
          if ! grep -aq "go-shim/backend_docker.go" "$bin"; then
            echo "::error::$bin is not a docker-backend build (no backend_docker.go symbols)"
            exit 1
          fi
          if grep -aq "go-shim/backend_podman.go" "$bin"; then
            echo "::error::$bin contains podman-backend symbols; the podman build clobbered it"
            exit 1
          fi
          echo "OK: $bin is a docker-backend build"

      # ── Diagnostics: inspect the Go shim library on Windows ARM64 ───────────
      - name: Inspect shim library (Windows aarch64)
        if: always() && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Path "target" -Filter "llmman_shim.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Write-Host "Found: $($lib.FullName) ($($lib.Length) bytes)"
            dumpbin /HEADERS "$($lib.FullName)" 2>&1 | Select-Object -First 20
            dumpbin /EXPORTS "$($lib.FullName)" 2>&1 | Select-String "llmman"
          } else {
            Write-Host "llmman_shim.lib NOT FOUND"
          }

      # ── Upload artefacts ──────────────────────────────────────────────────
      # Two attempts: the upload's final "FinalizeArtifact" call gets a
      # transient 403 from GitHub's blob store now and then, after every
      # byte is up. The action has no retry of its own, so the second
      # attempt overwrites whatever the first left behind.
      - name: Upload binary (docker)
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmman-docker-${{ matrix.target }}
          path: dist-docker/${{ matrix.binary }}
          if-no-files-found: error
      - name: Upload binary (docker, retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmman-docker-${{ matrix.target }}
          path: dist-docker/${{ matrix.binary }}
          if-no-files-found: error
          overwrite: true

  # --------------------------------------------------------------------------
  # Unit tests: every #[cfg(test)] module under src/, which live in the
  # lib target and the llmman-bench binary. These are pure-
  # Rust logic tests with no OS-specific behavior, but the crate itself
  # still links the Go shim via CGO, so a target-specific toolchain issue
  # (the exact kind the `build`/`e2e` jobs' own git history is full of —
  # lld-link vs MSVC link.exe, msvc-arch, ...) could just as easily break
  # `cargo test` as `cargo build`. Mirrors the `build` job's own 5-target
  # matrix exactly for that reason, rather than assuming Linux x86_64 is
  # representative of the other four.
  #
  # `cargo fmt --check` also lives here rather than in its own job:
  # formatting is platform-independent, so it only runs once, on the
  # Linux x86_64 leg (matrix.check-fmt below), instead of duplicating the
  # same check across all five targets.
  #
  # `cargo clippy` is the opposite case and runs on all five: clippy only
  # sees the `#[cfg]` arms selected for the target it runs against, and
  # this crate's platform-gated code is substantial (hostgpu/vendor.rs's
  # CUDA/HIP/Vulkan FFI, ffi.rs's windows-msvc Go-runtime bootstrap,
  # container::stop). Linting Linux alone is how ~22 dead-code warnings
  # accumulated on macOS unseen. `--release` shares dependency artefacts
  # with the `cargo test --release` step below.
  # --------------------------------------------------------------------------
  test:
    name: Unit tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          # check-fmt: true — this is the one leg that also runs
          # `cargo fmt --check` (see the job's own comment above on why
          # only here).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            check-fmt: true

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin

          # ── Windows x86_64 ────────────────────────────────────────────────
          # No linker override; build.rs makes the default MSVC link.exe
          # work — see the `build` job's own comment.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            msvc-arch: amd64
            rustflags: ""
            timeout: 60

          # ── Windows aarch64 ───────────────────────────────────────────────
          # rustflags empty like x86_64, but for a simpler reason: ARM64's
          # unwind encoding was never the problem, so it links with MSVC
          # link.exe and build.rs leaves its unwind data intact.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            msvc-arch: arm64
            rustflags: ""
            timeout: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native. components: rustfmt is only
      # actually needed on the check-fmt leg (see this job's own comment
      # above), but dtolnay/rust-toolchain accepts an empty components
      # list fine on every other leg, so this stays a single step rather
      # than a second, conditional "Set up Rust" step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy${{ matrix.check-fmt && ', rustfmt' || '' }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: test-${{ matrix.target }}

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO). macOS/Windows need
      # neither: Xcode's command-line tools already provide a C compiler
      # on the macOS runner image, and Windows' MSVC setup above covers it.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # Only runs on the check-fmt leg (Linux x86_64) — see this job's
      # own comment above on why formatting is checked once rather than
      # once per matrix entry.
      - name: cargo fmt --check
        if: matrix.check-fmt
        run: cargo fmt --all -- --check

      # `fuzzing` gates fuzz_check_parse_registry_ref in src/shortnames.rs,
      # which the fuzz/ crate below calls but nothing else in the tree
      # references. Without this step, a rename of ParsedRef's fields, or
      # of MAX_PART_LEN/MAX_HOST_LEN, compiles clean on every other leg
      # and only breaks the fuzz harness, with no CI signal. This only
      # compiles the feature; it does not run cargo-fuzz, which needs a
      # nightly toolchain this job does not install (actual fuzzing runs
      # on a developer's workstation, not in CI). Runs once, on the
      # check-fmt leg, same reason as cargo fmt: pure Rust logic, no
      # OS-specific `#[cfg]`.
      - name: cargo clippy --features fuzzing
        if: matrix.check-fmt
        run: cargo clippy --features fuzzing --lib -- -D warnings

      # fuzz/ is its own crate (cargo-fuzz's own convention), with its own
      # Cargo.toml, so the workspace-level clippy/test steps above never
      # touch it. A plain `cargo check` against its manifest catches it
      # going stale against src/shortnames.rs's public surface, without
      # needing cargo-fuzz or nightly. Same check-fmt gating as above: no
      # OS-specific behavior to test per target.
      - name: cargo check fuzz/
        if: matrix.check-fmt
        run: cargo check --manifest-path fuzz/Cargo.toml

      # -D warnings: the tree is clippy-clean as of this step being added,
      # so anything new is a regression, not a wart to triage.
      # --all-targets covers tests/ too. Default (docker) feature only:
      # `podman` gates a handful of `ffi` items, not whole subsystems, and
      # building its Go archive too would roughly double this job.
      - name: cargo clippy
        run: cargo clippy --release --target ${{ matrix.target }} --all-targets -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's). RUSTFLAGS no longer
      # carries a Windows linker choice: build.rs fixes the archive as it
      # produces it, so the separate test binary compiled here links the
      # same way the main binary does with nothing repeated per step.
      - name: cargo test --lib --bins
        run: cargo test --release --target ${{ matrix.target }} --lib --bins
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  # --------------------------------------------------------------------------
  # Lint: static analysis of go-shim/, which until now had none. `test`
  # above builds and runs the Go code but never checks it beyond what the
  # compiler requires, and `cargo fmt --check` covers only the Rust half.
  #
  # Which linters, and why, lives in go-shim/.golangci.yml — the single
  # source of truth, so a local `golangci-lint run` reproduces this job.
  #
  # Scope: this is the Linux view. Go drops OS-tagged files before
  # analysis, so push_stream_windows.go (19 lines) is compiled by the
  # `build` matrix but not linted here; cross-GOOS linting would need a
  # cross C toolchain, since dropping cgo breaks the typecheck.
  # --------------------------------------------------------------------------
  lint:
    name: Lint (go-shim)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # persist-credentials: false — this job runs `go test` on the PR's own
      # code, which has no reason to reach GITHUB_TOKEN via .git/config.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # Not golangci-lint's formatter support: this names the files.
      - name: gofmt --check
        working-directory: go-shim
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint (docker backend, production code)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go-shim
          args: --build-tags docker --tests=false --timeout=10m

      # Second pass with tests: catches a helper stranded in a _test.go
      # file once the test using it is deleted.
      - name: golangci-lint (docker backend, including tests)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go-shim
          args: --build-tags docker --timeout=10m

      # The podman-tagged files are invisible to the runs above. -D unused
      # is deliberate: `unused` sees one build-tag view at a time, so
      # docker-only helpers in shared files look dead from this side.
      # Tags mirror build.rs's podman list exactly.
      - name: golangci-lint (podman backend)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go-shim
          args: >-
            --build-tags podman,containers_image_openpgp,exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper
            -D unused
            --timeout=10m

      # No CI job ran these before. Both backends: each has test files the
      # other's tags exclude.
      - name: go test (docker backend)
        working-directory: go-shim
        run: go test -tags docker ./...

      - name: go test (podman backend)
        working-directory: go-shim
        run: go test -tags podman,containers_image_openpgp,exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper ./...

  # --------------------------------------------------------------------------
  # Packaging: runs packaging/version.sh and packaging/render.sh on every PR
  # and checks their output (Homebrew formula, winget manifests, the crate),
  # so a broken template fails here rather than after it has been pushed to
  # the tap or opened against winget-pkgs. `release` gates on this.
  # --------------------------------------------------------------------------
  packaging:
    name: Packaging (version, brew/winget templates, crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: shellcheck
        run: shellcheck packaging/version.sh packaging/render.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # MAJOR.MINOR from Cargo.toml (PATCH must stay 0), PATCH = commit
      # count; --apply must leave Cargo.toml and Cargo.lock agreeing.
      - name: version.sh
        id: version
        run: |
          set -euo pipefail
          base="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/^[^"]*"|".*$/,""); print; exit}' Cargo.toml)"
          count="$(git rev-list --count HEAD)"
          want="${base%.*}.$count"
          got="$(packaging/version.sh)"
          [ "$got" = "$want" ] || { echo "::error::version.sh printed $got, expected $want"; exit 1; }
          [ "${base##*.}" = "0" ] || { echo "::error::Cargo.toml PATCH is ${base##*.}, must stay 0 (CI owns it)"; exit 1; }

          packaging/version.sh --apply >/dev/null
          applied="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "$applied" = "$want" ] || { echo "::error::--apply left Cargo.toml at $applied, expected $want"; exit 1; }
          cargo metadata --locked --format-version 1 >/dev/null
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "OK: version $want applied to Cargo.toml and Cargo.lock"

      # Synthetic checksums: this checks rendering, not hashes. Everything
      # goes to $RUNNER_TEMP so `cargo package` below sees a clean tree.
      - name: Render formula and manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for asset in \
            llmman-aarch64-apple-darwin \
            llmman-x86_64-unknown-linux-gnu \
            llmman-aarch64-unknown-linux-gnu \
            llmman-x86_64-pc-windows-msvc.exe \
            llmman-aarch64-pc-windows-msvc.exe; do
            printf '%s  %s\n' "$(printf '%s' "$asset" | sha256sum | cut -d' ' -f1)" "$asset"
          done > "$RUNNER_TEMP/fake-checksums.txt"
          packaging/render.sh --version "$VERSION" --checksums "$RUNNER_TEMP/fake-checksums.txt" --out-dir "$RUNNER_TEMP/out"

          # A missing platform or a malformed version must be rejected.
          grep -v aarch64-unknown-linux-gnu "$RUNNER_TEMP/fake-checksums.txt" > "$RUNNER_TEMP/short.txt"
          if packaging/render.sh --version "$VERSION" --checksums "$RUNNER_TEMP/short.txt" --out-dir "$RUNNER_TEMP/out-bad" 2>/dev/null; then
            echo "::error::render.sh accepted a checksums file with no Linux aarch64 entry"; exit 1
          fi
          for bad in "v$VERSION" "$VERSION-rc1" "0.1" ""; do
            if packaging/render.sh --version "$bad" --checksums "$RUNNER_TEMP/fake-checksums.txt" --out-dir "$RUNNER_TEMP/out-bad" 2>/dev/null; then
              echo "::error::render.sh accepted version \"$bad\""; exit 1
            fi
          done
          echo "OK"

      # ruby -c catches the failure that breaks the whole tap (a formula
      # that does not parse). Homebrew also requires class == filename.
      - name: Check Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/out/Formula/llmman.rb"
          ruby -c "$f"
          grep -q '^class Llmman < Formula$' "$f" || { echo "::error::$f does not declare 'class Llmman'"; exit 1; }
          grep -q "^  version \"$VERSION\"$" "$f" || { echo "::error::$f does not declare version $VERSION"; exit 1; }
          for asset in llmman-aarch64-apple-darwin llmman-x86_64-unknown-linux-gnu llmman-aarch64-unknown-linux-gnu; do
            grep -q "releases/download/v$VERSION/$asset\"" "$f" || { echo "::error::$f has no url for $asset"; exit 1; }
          done
          [ "$(grep -c '^ *sha256 "[0-9a-f]\{64\}"$' "$f")" -eq 3 ] || { echo "::error::$f does not have exactly 3 sha256 lines"; exit 1; }
          if grep -q '^ *url ".*x86_64-apple-darwin' "$f"; then
            echo "::error::$f has a url for x86_64-apple-darwin, which llmman does not publish"; exit 1
          fi
          test -f "$RUNNER_TEMP/out/README.md"
          echo "OK: $f"

      # Against the real 1.12.0 manifest schemas. The timestamp override
      # keeps ReleaseDate a string, as winget's YAML parser does.
      - name: Check winget manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pyyaml jsonschema
          dir="$RUNNER_TEMP/out/manifests/l/llmmanorg/llmman/$VERSION"
          for t in version installer defaultLocale; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/schema-$t.json" \
              "https://raw.githubusercontent.com/microsoft/winget-cli/master/schemas/JSON/manifests/v1.12.0/manifest.$t.1.12.0.json"
          done
          "$RUNNER_TEMP/venv/bin/python" - "$dir" "$VERSION" "$RUNNER_TEMP" <<'PY'
          import json, sys, yaml, jsonschema
          d, version, tmp = sys.argv[1], sys.argv[2], sys.argv[3]
          class L(yaml.SafeLoader): pass
          L.add_constructor('tag:yaml.org,2002:timestamp', lambda l, n: l.construct_scalar(n))
          files = {
              "version": "llmmanorg.llmman.yaml",
              "installer": "llmmanorg.llmman.installer.yaml",
              "defaultLocale": "llmmanorg.llmman.locale.en-US.yaml",
          }
          docs = {}
          for t, name in files.items():
              with open(f"{d}/{name}") as fh:
                  doc = yaml.load(fh, Loader=L)
              jsonschema.validate(doc, json.load(open(f"{tmp}/schema-{t}.json")), format_checker=jsonschema.FormatChecker())
              assert doc["PackageIdentifier"] == "llmmanorg.llmman", name
              assert doc["PackageVersion"] == version, (name, doc["PackageVersion"])
              docs[t] = doc
              print(f"OK {name}: valid against manifest.{t}.1.12.0")
          inst = docs["installer"]
          assert inst["InstallerType"] == "portable", inst["InstallerType"]
          assert inst.get("Commands") == ["llmman"], inst.get("Commands")  # names the PATH symlink
          arches = {i["Architecture"]: i for i in inst["Installers"]}
          assert set(arches) == {"x64", "arm64"}, sorted(arches)
          for arch, triple in (("x64", "x86_64-pc-windows-msvc"), ("arm64", "aarch64-pc-windows-msvc")):
              i = arches[arch]
              assert i["InstallerUrl"] == f"https://github.com/llmmanorg/llmman/releases/download/v{version}/llmman-{triple}.exe", i["InstallerUrl"]
              assert len(i["InstallerSha256"]) == 64 and i["InstallerSha256"] == i["InstallerSha256"].upper(), i["InstallerSha256"]
              deps = [d["PackageIdentifier"] for d in i["Dependencies"]["PackageDependencies"]]
              assert deps == [f"Microsoft.VCRedist.2015+.{arch}"], (arch, deps)  # binaries import VCRUNTIME140.dll
          loc = docs["defaultLocale"]
          for key in ("Publisher", "PackageName", "License", "LicenseUrl", "ShortDescription", "Description", "Moniker", "ReleaseNotesUrl"):
              assert loc.get(key), f"locale manifest lacks {key}"
          print(f"OK: x64 and arm64 portable installers for v{version}")
          PY

      # `build`/`test` already compile this source on all five targets; this
      # checks the .crate carries what build.rs reads (go-shim/, webui/),
      # drops the dev-only paths, and fits crates.io's 10 MiB limit.
      # publish-crate does the verification build.
      - name: Check crate contents
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/files.txt"
          cargo package --no-verify --allow-dirty --list > "$files"
          for must in build.rs Cargo.toml Cargo.lock LICENSE README.md go-shim/go.mod go-shim/go.sum go-shim/shim.go \
                      go-shim/backend_docker.go go-shim/backend_podman.go \
                      webui/index.html webui/bundle.js webui/bundle.css webui/loading.html \
                      src/main.rs src/lib.rs src/webui.rs src/ffi.rs; do
            grep -qx "$must" "$files" || { echo "::error::$must is missing from the .crate"; exit 1; }
          done
          for never in '^packaging/' '^vllm-plugin/' '^docs/' '^\.github/' '^fuzz/' '^go-shim/go-shim$'; do
            if grep -q "$never" "$files"; then
              echo "::error::.crate contains files matching $never:"; grep "$never" "$files"; exit 1
            fi
          done
          cargo package --no-verify --allow-dirty
          crate="$(ls target/package/llmman-*.crate)"
          size="$(stat -c %s "$crate")"
          echo "$crate: $size bytes"
          [ "$size" -lt $((10 * 1024 * 1024)) ] || { echo "::error::$crate is over crates.io's 10 MiB limit"; exit 1; }
          echo "OK: crate contents ($(wc -l < "$files") files)"

  # --------------------------------------------------------------------------
  # E2E: `llmman launch <claude|opencode|codex|qwen|hermes|openclaw|dsh> --model
  # qwen3.5:0.8b` (tests/launch_e2e.rs) against a real `llmman serve`, a
  # real pulled model, a real llama-server, and the real third-party CLIs
  # — not mocks. Mirrors the `build` job's own 5-target matrix exactly
  # (same runners, same msvc-arch/rustflags choices), so the launch/env/
  # config plumbing this actually exercises gets checked on every
  # platform/architecture llmman ships a binary for, not just a subset.
  #
  # Also runs vllm-plugin/tests/test_e2e.py (Linux x86_64/aarch64 and
  # macOS aarch64, both `matrix.backend` entries) against this job's own
  # installed `llmman` binary and a real `vllm serve` — CPU-only on
  # Linux, Metal-GPU-backed (via vllm-metal) on macOS.
  #
  # On the two macOS aarch64 legs (`matrix.backend` docker and podman —
  # see this job's own matrix below; "backend" there is the OCI-transport
  # Cargo feature `llmman` itself was built with, unrelated to how a
  # model gets served) `tests/launch_e2e.rs`'s own
  # `serve_mlx_safetensors_model` test additionally pulls and serves a
  # real safetensors model via `llmman serve`'s new, separate
  # `mlx_lm.server` backend (see cmd::serve::use_mlx_for_safetensors) —
  # not vllm-metal above, a different plugin (Metal GPU support bolted
  # onto `vllm serve` itself) this job's own vllm-plugin steps already
  # cover independently — the only two matrix entries where "Install
  # mlx-lm (macOS arm64, e2e)" below actually installs it; every other
  # entry's copy of that same test skips itself instead (mlx-lm has no
  # non-Apple-Silicon build to test against).
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (launch claude/opencode/codex/qwen/hermes/openclaw/dsh, vllm-plugin, mlx) — ${{ matrix.target }} (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    # These take a long time (see the timeout-minutes comment below), so
    # they're skipped on pull_request entirely and only run on the one
    # push event that leads to a release: a push to main — see the
    # `release` job's own `needs`, which includes this job for exactly
    # that reason, and its own identical `if:` condition below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 7 tests run serialized (--test-threads=1 + lock_serial()), so the
    # worst case sums all 7's own retry budgets: MAX_ATTEMPTS * TIMEOUT
    # (3 * 600s = 30 min) each — a timeout itself never retries (see
    # launch_and_assert's own doc comment), so 30 min/test is only hit if
    # every attempt fails via a missing "pong" instead. Plus warm_model()'s
    # own separate TIMEOUT budget (10 min), paid at most once across all
    # tests (guarded by WARM's own Once). 7*30 + 10 = 220 min; 240 leaves
    # headroom on top of that for setup/build overhead (5-8 min on
    # Windows). Exhausting every attempt doesn't fail this job either way
    # (see launch_and_assert's own doc comment) — a run can still
    # legitimately take this long in wall-clock time before giving up.
    #
    # +90 on top of that 240 (330 total) for the vllm-plugin steps'
    # own per-step budgets below: up to 60 min for "Install vLLM (e2e)"
    # (wheel downloads, but a slow/retried one on a bad connection) plus
    # up to 30 min for "pytest -m e2e (vllm-plugin)".
    #
    # +10 more (340 total) for `serve_mlx_safetensors_model`'s own single
    # TIMEOUT budget (10 min, same 600s as warm_model's) — it doesn't go
    # through launch_and_assert's retry loop at all (a real failure there
    # is always a deterministic llmman bug worth failing loudly on, not
    # small-model sampling variance), so unlike the 7 launch tests above
    # it never multiplies by MAX_ATTEMPTS.
    #
    # +11 more (351 total) for `launch_dsh_web_default_starts_and_stops_cleanly`'s
    # own single-attempt budget: up to TIMEOUT (10 min) polling for dsh's
    # web server to accept a connection, plus its own separate 30s bound
    # on a graceful stop before falling back to a forceful kill — like
    # `serve_mlx_safetensors_model` above, one deterministic attempt, not
    # multiplied by MAX_ATTEMPTS.
    timeout-minutes: 351
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (docker backend) ────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux aarch64 (docker backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux x86_64 (podman backend) ────────────────────────────────
          # Same runner/llama-asset as the docker entry above, just linked
          # against go-shim/backend_podman.go (go.podman.io/image) instead
          # of go-shim/backend_docker.go — this is the only place that
          # backend's actual pull/push code path gets exercised end-to-end
          # against a real registry; the `test` job's own unit tests never
          # touch the ffi::* boundary that differs between backends, and
          # the `build` job only compiles this backend, it doesn't run it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── Linux aarch64 (podman backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── macOS aarch64 (Apple Silicon, docker backend) ────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: macos-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── macOS aarch64 (Apple Silicon, podman backend) ────────────────
          # Same reasoning as the Linux podman entries above; `build`
          # already compiles this backend for macOS, but nothing
          # previously ran it against a real registry there.
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: macos-arm64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── Windows x86_64 (docker backend) ──────────────────────────────
          # No linker override; build.rs makes the default MSVC link.exe
          # work — see the `build` job's own comment. No podman entry:
          # containers/image has no Windows support.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            llama-asset: win-cpu-x64.zip
            msvc-arch: amd64
            rustflags: ""
            backend: docker
            feature-flags: ""

          # ── Windows aarch64 (docker backend) ─────────────────────────────
          # rustflags empty; ARM64 keeps its unwind data — see `test`.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            llama-asset: win-cpu-arm64.zip
            msvc-arch: arm64
            rustflags: ""
            backend: docker
            feature-flags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # backend, not just target: the docker/podman entries sharing a
          # target build with different --features, and Cargo's target dir
          # doesn't itself key build artefacts by feature set — an
          # unqualified key here would have them fight over (and keep
          # invalidating) the same cache entry.
          key: e2e-${{ matrix.target }}-${{ matrix.backend }}

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) + llama-server's own
      # runtime shared-library deps. macOS/Windows need neither: Xcode's
      # command-line tools already provide a C compiler on the macOS
      # runner image, and both platforms' llama-server release archives
      # are fully self-contained (verified via `strings`/load-command
      # inspection — no external libomp/libcurl reference either way).
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgomp1 libcurl4

      # ── Node.js (for the claude/opencode/codex CLIs under test) ────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # `shell: bash` (not the Windows default of `pwsh`) for consistent
      # multi-line/array syntax; ubuntu/macOS already default to bash.
      #
      # Unlike hermes/mlx_lm.server (legitimately missing on some
      # platforms), these six are plain npm packages expected to work
      # everywhere — so install_cli fails the job, rather than letting
      # tests/launch_e2e.rs's on_path check silently skip, when one never
      # becomes a working binary.
      #
      # install_cli also verifies with `<bin> --version`, not just a
      # bare `npm install -g`: CI 33006723521 saw `npm install -g
      # @openai/codex` exit 0 while the `codex` it produced failed every
      # invocation with "Missing optional dependency
      # @openai/codex-darwin-arm64" — optionalDependencies working as
      # designed (npm tolerates one failed platform-tarball fetch, here
      # a registry blip, instead of failing the install), just not
      # detectable by a mere on_path/PATH check. Retrying rides that out.
      - name: Install integration CLIs (claude, opencode, codex, qwen, openclaw, dsh)
        shell: bash
        run: |
          failed_clis=()

          install_cli() {
            local install_spec="$1" pkg_name="$2" bin="$3"
            local max_attempts=6
            for attempt in $(seq 1 "$max_attempts"); do
              if [ "$attempt" -gt 1 ]; then
                # Clear npm's cache so a corrupted/incomplete cached
                # response from the last attempt can't repeat itself.
                npm cache clean --force >/dev/null 2>&1 || true
              fi
              local next="retrying"
              [ "$attempt" -eq "$max_attempts" ] && next="giving up"
              if ! npm install -g "$install_spec"; then
                echo "::warning::$pkg_name install failed on ${{ runner.os }} (attempt $attempt/$max_attempts); $next"
              elif version_output=$("$bin" --version 2>&1); then
                return 0
              else
                echo "::warning::$pkg_name installed but \"$bin --version\" failed on ${{ runner.os }} (attempt $attempt/$max_attempts); $next — output: $version_output"
              fi
              # Exponential backoff: 1s, 2s, 4s, 8s, 16s.
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$((2 ** (attempt - 1)))"
              fi
            done
            echo "::error::$pkg_name never produced a working \"$bin\" on ${{ runner.os }} after $max_attempts attempts"
            failed_clis+=("$pkg_name")
          }

          install_cli "@anthropic-ai/claude-code" "@anthropic-ai/claude-code" "claude"
          install_cli "opencode-ai" "opencode-ai" "opencode"
          install_cli "@openai/codex" "@openai/codex" "codex"
          # Pinned (not @latest): tests/launch_e2e.rs's qwen test relies on
          # this release's tool set under --safe-mode and on the
          # report_findings schema it excludes by name; a newer release can
          # change either. Bump deliberately, re-running that test.
          install_cli "@qwen-code/qwen-code@0.22.3" "@qwen-code/qwen-code" "qwen"
          # Pinned (not @latest): tests/launch_e2e.rs's own openclaw
          # invocation was verified against this exact release — its
          # docs describe CLI commands/flags this build doesn't actually
          # have (see launch_and_assert_tolerating's own doc comment),
          # so an unpinned upgrade could silently break the same way
          # again with no warning here.
          install_cli "openclaw@2026.7.1-2" "openclaw" "openclaw"
          # Pinned (not @latest): dsh is pre-1.0 (0.1.2-rc.1) and
          # tests/launch_e2e.rs's own invocation (--profile headless) was
          # verified against this exact release; an unpinned upgrade
          # could silently change that profile's flags or behavior with
          # no warning here.
          install_cli "@deepseek-ai/dsh@0.1.2-rc.1" "@deepseek-ai/dsh" "dsh"

          if [ "${#failed_clis[@]}" -gt 0 ]; then
            echo "::error::the following integration CLIs never became installable on ${{ runner.os }} after retries: ${failed_clis[*]}"
            exit 1
          fi

      # hermes has no npm package (install.sh/install.ps1 only, like
      # llmman's own install scripts) — --skip-setup skips its
      # interactive onboarding wizard, since tests/launch_e2e.rs's own
      # write_hermes_config already configures it non-interactively.
      # Adds ~/.local/bin to GITHUB_PATH since that's where install.sh
      # puts the binary and it isn't necessarily already on PATH here.
      - name: Install Hermes Agent (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup || echo "::warning::hermes install failed on ${{ runner.os }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Hermes Agent (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          & ([scriptblock]::Create((irm https://hermes-agent.nousresearch.com/install.ps1))) -SkipSetup

      # opencode installs its configured provider's npm package (here
      # @ai-sdk/openai-compatible — see launch::opencode_config) on demand
      # into ~/.config/opencode/node_modules the first time a fresh HOME
      # uses it. Pay that cost here, separately diagnosable, instead of
      # inside tests/launch_e2e.rs's own per-launch timeout, so a slow
      # first-time install there can't masquerade as a hung launch.
      #
      # The target baseURL is deliberately unreachable (this only needs to
      # trigger the provider package install, not a real response) — which
      # means this can *only* ever time out, never exit cleanly: opencode's
      # ai-sdk runtime retries a failed connection indefinitely rather than
      # giving up, so there's no successful exit code to wait for once the
      # (fast) npm install itself is done. `timeout` (not the job's own
      # timeout-minutes) enforces a much shorter cap so this doesn't waste
      # CI time being deliberately, permanently unreachable, and `|| true`
      # tolerates the resulting SIGTERM/failure. Also tolerates opencode
      # itself not being installed (see the step above) — `command -v`
      # guards against that rather than failing here instead.
      #
      # `--kill-after=10` escalates to SIGKILL, since a process deep in
      # that retry loop doesn't reliably act on SIGTERM. Not enough on
      # Windows: `opencode` on PATH there is npm's sh shim, which runs the
      # real opencode.exe as a child (Git Bash can't exec a native binary
      # in place), and `timeout` kills only the shim. The orphaned
      # opencode.exe keeps this step's stdout open, so the step never ends
      # — a real x86_64-windows-2025 run sat here 45 min until the runner
      # itself died ("lost communication with the server"). So it is
      # killed by name too, and `timeout-minutes` is the backstop
      # (`continue-on-error`: the backstop firing is not a failed job).
      - name: Warm up opencode's on-demand provider install
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: |
          export OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","name":"Ollama","options":{"baseURL":"http://127.0.0.1:1/v1"},"models":{"warmup":{"name":"warmup"}}}},"model":"ollama/warmup"}'
          command -v opencode >/dev/null && timeout --kill-after=10 45 opencode run "hi" --print-logs --log-level DEBUG || true
          [ "$RUNNER_OS" = Windows ] && taskkill //F //T //IM opencode.exe || true

      # ── llama-server (the inference backend `llmman serve` shells out to) ──
      # A prebuilt release straight from upstream llama.cpp, pinned so CI
      # doesn't silently pick up a build that changes behavior mid-flight;
      # bump the top-level env's LLAMA_CPP_RELEASE deliberately when a
      # newer one is needed — that one edit is enough, unlike the old
      # per-matrix-entry hardcoded filenames it replaced. `matrix.llama-asset`
      # is just this OS/arch's release asset *suffix* (the Windows ones are
      # .zip, the other three .tar.gz — extracted differently per OS below,
      # see that step's own comment on why); combined with LLAMA_CPP_RELEASE
      # below into the real filename. The ubuntu/macOS archives unpack into
      # one llama-<tag> subdirectory; the Windows one doesn't — found
      # dynamically below rather than hardcoding either layout.
      - name: Install llama-server
        shell: bash
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}"
          # $HOME, not $RUNNER_TEMP: on Windows the latter is a native
          # `D:\a\_temp`-style path, and Git Bash's tar.exe (bsdtar) reads
          # the drive letter's colon as its own old rmt "host:path" remote-
          # archive syntax instead ("tar: Cannot connect to D: resolve
          # failed") — confirmed against a real windows-2025 run. $HOME is
          # already the plain POSIX-style path (`/c/Users/...`) Git Bash
          # itself uses throughout, on every OS this runs on.
          #
          # The local filename keeps $asset's own extension (not a fixed
          # generic name) — confirmed directly against a real windows-2025
          # run that Expand-Archive (see below) determines archive format
          # purely from the filename extension, unlike tar/file, which
          # sniff actual file content: an extension-less name downloaded
          # and byte-for-byte verified as a real zip still got "is not a
          # supported archive file format" from it.
          archive="$HOME/$asset"
          # --retry 16, not 5: confirmed on real ubuntu-24.04 and
          # windows-2025 runs that this specific download (GitHub's
          # release-assets CDN, not this repo's own code) can 503/"Empty
          # reply from server" for longer than curl's default exponential
          # backoff burns through 5 retries in (~30s total) — every attempt
          # failing without ever reaching a working response. More retries
          # (same exponential backoff, just more of it) rides out a longer
          # CDN blip while still eventually giving up if the asset is
          # genuinely gone.
          curl -fsSL --retry 16 --retry-all-errors -o "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/${asset}"
          dir="$HOME/llama-cpp"
          mkdir -p "$dir"
          # Windows needs Expand-Archive, not tar -xf: confirmed against a
          # real windows-2025 run that the .zip downloads correctly (right
          # size, and `file` agrees it's a genuine zip) but Git for
          # Windows' bundled tar.exe (bsdtar) still rejects it outright
          # ("This does not look like a tar archive") — that build simply
          # doesn't support the zip format tar/find/cargo's own automatic
          # POSIX<->Windows path translation would otherwise make this a
          # non-issue for. macOS's and Linux's own tar (bsdtar and GNU tar,
          # respectively) both handle their own .tar.gz asset here fine.
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$dir")' -Force"
          else
            tar -xf "$archive" -C "$dir"
          fi
          # Exact names only (not a `llama-server*` glob): the Windows
          # archive also ships a sibling llama-server-impl.dll, which
          # a wildcard would just as happily match first.
          bin=$(find "$dir" -type f \( -iname 'llama-server' -o -iname 'llama-server.exe' \) | head -n1)
          bindir=$(dirname "$bin")
          # $GITHUB_PATH crosses out of this bash step into whatever shell
          # later steps use (pwsh by default on Windows) — which, unlike
          # tar/find/cargo right above, doesn't go through Git Bash's own
          # automatic POSIX<->Windows path translation. A bare Git-Bash
          # path (`/c/Users/...`) written here would be silently useless
          # PATH-wise to that pwsh-run cargo/cargo-test's own child-process
          # spawn, so it's converted to the native `C:\Users\...` form
          # cygpath (bundled with Git for Windows) exists specifically for.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cygpath -w "$bindir" >> "$GITHUB_PATH"
          else
            echo "$bindir" >> "$GITHUB_PATH"
          fi
          # Only Linux needs this: llama-server's shared libraries sit
          # right next to it either way, but macOS's build resolves those
          # via @rpath/@loader_path and Windows' via the same-directory DLL
          # search every EXE already gets for free — neither needs (nor,
          # for DYLD_LIBRARY_PATH under macOS's hardened runtime, reliably
          # even honors) an extra library-search env var the way Linux's
          # dynamic linker does.
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=$bindir" >> "$GITHUB_ENV"
          fi

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's, rather than relying on
      # implicit host-target resolution). matrix.feature-flags is empty
      # for the docker entries (its default) and
      # "--no-default-features --features podman" for the two podman ones
      # — mirrors the `build` job's own separate "Build (podman backend)"
      # step, just reused here as a matrix dimension instead of a second
      # step, since this job needs the resulting binary under test either
      # way, not just a successful compile.
      - name: Build llmman
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.feature-flags }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Install llmman via the real install script ───────────────────────
      # Runs the actual install.sh (Unix) / install.ps1 (Windows) a real
      # user's `curl ... | sh` / `irm ... | iex` runs — fetched from
      # https://llmmanorg.github.io/, their only home (repo
      # llmmanorg/llmmanorg.github.io, static/) — pointed (via
      # LLMMAN_BASE_URL — an env override added to both scripts
      # specifically for this) at a throwaway local HTTP server serving
      # *this job's own* just-built binary from the step above, instead of
      # a real GitHub release: a release for a commit/PR still under test
      # wouldn't exist yet, and even on `main` a real release still lags
      # one full CI run behind whatever's actually being tested right now.
      # Every other part of the install — OS/arch detection, the download
      # itself, the `--version` smoke check, and the final
      # install-directory copy — runs completely unmodified, so this is a
      # real test of the install script's own logic, not a stand-in for
      # it. `tests/launch_e2e.rs` (next step) then runs the resulting
      # *installed* binary (via LLMMAN_E2E_BIN, set below) instead of the
      # one `cargo build` itself dropped in target/, so the whole e2e
      # suite ends up testing the same artifact a real install actually
      # produces.
      #
      # `shell: bash` throughout (including the Windows entries, same as
      # the "Install llama-server" step above): install.ps1 itself still
      # needs real PowerShell, invoked here as `pwsh -NoProfile -File`
      # from within this bash script — the same pattern that step already
      # uses for `powershell -NoProfile -Command` — rather than a second,
      # Windows-only `shell: pwsh` step, since everything else here (the
      # local server, the download readiness poll) is identical on every
      # OS.
      - name: Install llmman (via install script)
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="llmman-$target.exe"
            bin="target/$target/release/llmman.exe"
          else
            asset="llmman-$target"
            bin="target/$target/release/llmman"
          fi

          # Mirrors the one path shape both scripts ever request
          # ("<base>/latest/download/<asset>" — neither script is given
          # LLMMAN_VERSION here, so both take their own "latest" branch),
          # so the download step below is exercising the exact same
          # URL-construction logic a real unpinned install does.
          release_dir="$RUNNER_TEMP/fake-releases/latest/download"
          mkdir -p "$release_dir"
          cp "$bin" "$release_dir/$asset"

          # A minimal static file server (plain Node http/fs — no npm
          # package fetch) standing in for GitHub's own release-asset
          # CDN. Node, not e.g. Python: every entry in this matrix already
          # has Node on PATH (set up above for the claude/opencode/codex
          # CLIs under test), so this adds no new dependency/toolchain,
          # unlike Python (present, but not guaranteed to be `python3` vs
          # `python` the same way across all five of this matrix's OSes).
          # A real HTTP round trip, not a file:// URL curl/Invoke-WebRequest
          # would also happily accept but a real install never goes
          # through.
          cat > "$RUNNER_TEMP/serve-release.js" <<'EOF'
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const port = Number(process.argv[3]);
          http.createServer((req, res) => {
            const file = path.join(root, decodeURIComponent(req.url));
            fs.readFile(file, (err, data) => {
              if (err) { res.writeHead(404); res.end(); return; }
              res.writeHead(200);
              res.end(data);
            });
          }).listen(port, "127.0.0.1");
          EOF
          node "$RUNNER_TEMP/serve-release.js" "$RUNNER_TEMP/fake-releases" 8791 &
          server_pid=$!
          # This server only needs to live long enough for the install
          # below — killed at the end of this step either way (`trap ...
          # EXIT`, not a separate step) rather than left running for the
          # rest of the job for nothing.
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:8791/latest/download/$asset" -o /dev/null 2>/dev/null && break
            sleep 0.2
          done

          export LLMMAN_BASE_URL="http://127.0.0.1:8791"
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL --retry 3 -o install.ps1 https://llmmanorg.github.io/install.ps1
            pwsh -NoProfile -File install.ps1
            # cygpath -w, not a bare "$LOCALAPPDATA/..." concatenation:
            # this exact value is about to cross into $GITHUB_ENV for the
            # *next* step's own child process (tests/launch_e2e.rs's
            # `Command::new`) to spawn directly — a canonical
            # backslash-separated Windows path there is one less thing to
            # go wrong than relying on that consumer also tolerating
            # forward slashes.
            install_bin=$(cygpath -w "$LOCALAPPDATA/Microsoft/WindowsApps/llmman.exe")
          else
            curl -fsSL --retry 3 -o install.sh https://llmmanorg.github.io/install.sh
            sh install.sh
            install_bin="$HOME/.local/bin/llmman"
            # install.sh itself only prints instructions to add this to
            # PATH for *future* shell sessions (see its own PATH-check
            # branch) — added here too so any later step in this job that
            # just runs `llmman` bare (matching what a real post-install
            # shell would do) can.
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

          "$install_bin" --version
          echo "LLMMAN_E2E_BIN=$install_bin" >> "$GITHUB_ENV"

      # LLAMA_ARG_N_GPU_LAYERS=0 on macOS only: llama-server reads this
      # itself (it's the env form of its own --gpu-layers flag), and this
      # process's environment reaches the llama-server subprocess
      # cmd::serve spawns several layers down (llmman launch -> llmman
      # serve -> llama-server, each just inheriting the parent's env by
      # default) without llmman itself needing any change. Root-caused via
      # the new serve.log diagnostic against a real macOS run: this
      # specific pinned llama.cpp release's Metal backend cannot actually
      # run qwen3.5's Gated Delta Net / Flash Attention ops at all ("...
      # assigned to device MTL0 but ... is assigned to device CPU (usually
      # due to missing support)" — logged for both, immediately followed
      # by thousands of "ggml_metal_buffer_get_id: error: tensor '(view)'
      # buffer is nil"), and did in fact crash outright under a real
      # Claude Code prompt's actual size, not this suite's own tiny one —
      # a real, pre-existing llama.cpp/Metal gap for this specific model
      # architecture, not anything about llmman's own code, so forcing
      # pure CPU inference is scoped to this one test's environment,
      # not any change to how llmman itself launches llama-server for
      # real users' models (the overwhelming majority of which have no
      # such issue and would lose real Metal acceleration for nothing).
      #
      # Set via a separate, macOS-only step into $GITHUB_ENV rather than
      # this step's own `env:` (confirmed broken on a real
      # x86_64-unknown-linux-gnu run: llama-server treats even an *empty*
      # value as present and tries to parse it as an integer regardless —
      # "error while handling environment variable
      # \"LLAMA_ARG_N_GPU_LAYERS\": stoi") — or inline in this step's own
      # script with `shell: bash` (confirmed broken on a real
      # aarch64-pc-windows-msvc run a different way: forcing bash here
      # reorders PATH enough that rustc's link.exe resolves to Git for
      # Windows' own unrelated /usr/bin/link.exe — a hardlink-creation
      # utility that happens to share the name — instead of MSVC's
      # linker). A step gated on `if:` so it only even runs on macOS,
      # writing to $GITHUB_ENV, avoids both: every other platform's
      # environment and shell for the actual test step below stays
      # completely untouched.
      - name: Force CPU-only llama-server (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: echo "LLAMA_ARG_N_GPU_LAYERS=0" >> "$GITHUB_ENV"

      # ── mlx-lm (macOS arm64 only) ─────────────────────────────────────────
      # Apple Silicon's own Metal-accelerated backend for safetensors
      # models (see cmd::serve::use_mlx_for_safetensors) — installed, and
      # its `mlx_lm.server` console script put on PATH, *before* "cargo
      # test --test launch_e2e" below spawns this job's one shared
      # `llmman serve` daemon (see tests/launch_e2e.rs's own module doc
      # comment on why every test in that file shares one daemon): PATH is
      # fixed at that daemon's own spawn time, like every other part of a
      # child process's inherited environment, so installing this any
      # later would leave the already-running daemon unable to find
      # `mlx_lm.server` for the rest of this job — installing it here,
      # before that daemon ever starts, is the only ordering that works.
      # A separate venv from vllm-plugin's own (set up further below, for
      # both Linux and macOS) rather than reusing it: that one doesn't
      # exist yet at this point in the job, and giving mlx-lm its own
      # keeps this step's ordering constraint independent of that one's.
      #
      # `serve_mlx_safetensors_model` (tests/launch_e2e.rs) is the only
      # test that actually needs this — every other one in that file
      # serves qwen3.5:0.8b (a GGUF model, llama-server's own territory,
      # never mlx's) — and, like every other prerequisite in that file,
      # skips itself (rather than failing) when `mlx_lm.server` isn't on
      # PATH, so this step is deliberately scoped to macOS arm64 only:
      # mlx-lm has no non-Apple-Silicon build to even attempt installing
      # elsewhere.
      - name: Set up Python (mlx e2e)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install mlx-lm (macOS arm64, e2e)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mlx-lm-venv"
          "$RUNNER_TEMP/mlx-lm-venv/bin/pip" install mlx-lm
          echo "$RUNNER_TEMP/mlx-lm-venv/bin" >> "$GITHUB_PATH"

      # --target: for the same reason as the Build llmman step above.
      # RUSTFLAGS no longer carries a Windows linker choice. This step
      # compiles its own test binary (tests/launch_e2e.rs) against the same
      # Go-shim archive, and used to hit LNK1223 whenever the flag was
      # missing here, since a step never inherits another's `env:`.
      # build.rs now fixes the archive itself, so that is gone.
      # matrix.feature-flags: same reasoning as the Build llmman step —
      # this test binary must link against the same backend the one built
      # above did, or the two podman entries would silently test a docker-
      # backed binary instead.
      #
      # LLMMAN_E2E_BIN isn't set here — it doesn't need to be. The
      # "Install llmman (via install script)" step above already exported
      # it into $GITHUB_ENV, which every later step in this job (this one
      # included) inherits automatically; see tests/launch_e2e.rs's own
      # `llmman_bin` doc comment for what it's actually for: making this
      # whole suite launch the *installed* binary the step above produced,
      # not the one `cargo build`/this step's own compile drops in
      # target/ (which still happens regardless — env!("CARGO_BIN_EXE_llmman")
      # is a compile-time macro, and it's still that step's fallback for a
      # plain local `cargo test` run).
      - name: cargo test --test launch_e2e
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.feature-flags }} --test launch_e2e -- --test-threads=1 --nocapture
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # The step above leaves its shared `llmman serve` daemon (see
      # tests/launch_e2e.rs) running with qwen3.5:0.8b resident at the
      # 256k default --ctx-size — several GiB nothing below needs (`llmman
      # resolve` never talks to the daemon). On a real aarch64 run that
      # left `vllm serve` only 3.3 of 15.6 GiB, under the KV arena it
      # demands up front (see test_e2e.py's VLLM_CPU_KVCACHE_SPACE).
      #
      # Signals the daemon's process group, which its llama-server shares,
      # the same way daemon::kill_daemon does: pid from /api/version,
      # `pkill -f` fallback. Never fails the job: a daemon that never
      # started (every launch_e2e test skipped) is fine here.
      - name: Stop the launch_e2e daemon (free RAM for vllm-plugin e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          host="${LLMMAN_HOST:-127.0.0.1:17434}"
          pid=$(curl -fsS --max-time 5 "http://$host/api/version" 2>/dev/null \
            | python3 -c 'import json, sys; print(json.load(sys.stdin).get("pid") or "")' 2>/dev/null) || pid=""
          # Only signal a pid that is numeric and still an llmman process.
          case "$pid" in ''|*[!0-9]*) pid="" ;; esac
          if [ -n "$pid" ] && ! ps -o command= -p "$pid" 2>/dev/null | grep -q 'llmman'; then
            echo "pid $pid from /api/version is not an llmman process; ignoring"
            pid=""
          fi
          if [ -n "$pid" ]; then
            echo "stopping llmman serve (pid $pid) and its process group"
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          else
            echo "no llmman serve daemon at $host; falling back to pkill"
            pkill -TERM -f 'llmman serve' 2>/dev/null || true
          fi
          # A SIGTERM'd process still holds its memory until it has exited.
          for _ in $(seq 1 30); do
            pgrep -f 'llmman serve|llama-server' >/dev/null 2>&1 || break
            sleep 1
          done
          if pgrep -f 'llmman serve|llama-server' >/dev/null 2>&1; then
            echo "::warning::llmman serve/llama-server still alive 30s after SIGTERM; sending SIGKILL"
            pkill -KILL -f 'llmman serve|llama-server' 2>/dev/null || true
            sleep 2
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then free -m; else vm_stat; fi

      # ── vllm-plugin e2e (Linux + macOS) ──────────────────────────────────
      # `vllm-plugin/tests/test_e2e.py` against this job's own installed
      # `llmman` binary and a real `vllm serve` — CPU-only on Linux,
      # Metal-GPU-backed (via vllm-metal) on macOS. Excludes Windows: no
      # vLLM CPU wheel/backend exists for it.
      #
      # Uses a venv, not the bare system python3 (Ubuntu 24.04's is PEP
      # 668-locked). Both vllm-plugin and vllm (next step) install into
      # this same venv so the plugin's entry point (see pyproject.toml)
      # is actually discoverable by the vllm process.
      - name: Set up Python (vllm-plugin e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install vllm-plugin (e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vllm-plugin-venv"
          "$RUNNER_TEMP/vllm-plugin-venv/bin/pip" install -e ./vllm-plugin pytest
          echo "$RUNNER_TEMP/vllm-plugin-venv/bin" >> "$GITHUB_PATH"

      # No GPU assumed on Linux, so that leg installs vLLM's CPU wheel,
      # not the default CUDA one. macOS installs that same upstream
      # "+cpu" wheel (a GitHub release asset since v0.26.0; PyPI still
      # has none) plus vllm-metal on top, which overrides vLLM's
      # CpuPlatform autodetection with a real Metal-GPU MetalPlatform via
      # its own `vllm.platform_plugins` entry point — building vLLM's
      # CPU backend from source on macOS instead (this job's prior
      # approach) hung forever inside its own CPU worker, regardless of
      # --dtype (see git history).
      # LD_PRELOAD (Linux x86_64 only): vLLM's CPU wheel needs Intel
      # OpenMP preloaded; located via a glob scoped to this venv.
      - name: Install vLLM (e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/vllm-plugin-venv"

          if [ "${{ runner.os }}" = "macOS" ]; then
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm/releases/download/v${VLLM_VERSION}/vllm-${VLLM_VERSION}%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl"
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm-metal/releases/download/v${VLLM_METAL_VERSION}/vllm_metal-${VLLM_METAL_VERSION}-cp312-cp312-macosx_15_0_arm64.whl"
          else
            case "${{ matrix.target }}" in
              x86_64-*) arch=x86_64 ;;
              aarch64-*) arch=aarch64 ;;
              *) echo "unhandled target for vLLM CPU wheel: ${{ matrix.target }}" >&2; exit 1 ;;
            esac
            wheel="vllm-${VLLM_VERSION}+cpu-cp38-abi3-manylinux_2_34_${arch}.whl"
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm/releases/download/v${VLLM_VERSION}/$wheel" \
              --extra-index-url https://download.pytorch.org/whl/cpu

            if [ "$arch" = "x86_64" ]; then
              iomp=$("$venv/bin/python3" -c "import glob, sysconfig; m = glob.glob(sysconfig.get_paths()['purelib'] + '/**/libiomp5.so', recursive=True); print(m[0] if m else '')")
              if [ -n "$iomp" ]; then
                echo "LD_PRELOAD=$iomp" >> "$GITHUB_ENV"
              else
                echo "::warning::libiomp5.so not found under $venv; LD_PRELOAD not set for vLLM CPU (x86_64)"
              fi
            fi
          fi

      # LLMMAN_BIN isn't needed: `llmman` is already on PATH (added to
      # $GITHUB_PATH by "Install llmman (via install script)" above).
      - name: pytest -m e2e (vllm-plugin)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 30
        run: pytest -m e2e -v
        working-directory: vllm-plugin

      # `llmman serve`'s own stdout/stderr never reach the test's own logs
      # above at all — see daemon::ensure_server's doc comment on why it's
      # detached and redirected to this file instead. A real macOS run
      # failed with the daemon returning a stale port for an already-
      # loaded model ("Connection refused" — the process backing it must
      # have exited without cmd::serve's own `running` map being told),
      # and this file is the only place that could show why (e.g. an
      # unexpected daemon restart, a crashed llama-server, ...) — always
      # run (not just on failure) since a *passing* run's log is useful
      # comparison context for a failing one on another platform/run.
      - name: Show llmman serve.log (diagnostic)
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            log="$LOCALAPPDATA/llmman/serve.log"
          else
            log="$HOME/.local/share/llmman/serve.log"
          fi
          if [ -f "$log" ]; then
            echo "--- $log ---"
            cat "$log"
          else
            echo "no serve.log found at $log"
          fi

      # ── Diagnostic: partial blob sizes on a failed pull ──────────────────
      # TEMPORARY — investigating the podman e2e job's real pull taking
      # far longer than expected. serve.log's own bar-rendering output
      # (mpb, above) tells us nothing useful when redirected to a plain
      # file rather than a real TTY, so this exists purely to answer one
      # question directly: at failure time, is the target blob sitting at
      # 0 bytes (a true stall — the new watchdog in backend_podman.go
      # should already prevent this) or some large-but-incomplete size
      # (genuinely slow/throttled network, not a stall at all)?
      - name: Show partial blob sizes (diagnostic, podman only)
        if: always() && matrix.backend == 'podman'
        shell: bash
        run: |
          dir="$HOME/.local/share/llmman/store/blobs/sha256"
          if [ -d "$dir" ]; then
            echo "--- $dir ---"
            ls -la "$dir"
          else
            echo "no blobs dir found at $dir"
          fi

  # --------------------------------------------------------------------------
  # Release: a GitHub Release per commit on main, tagged v<version> where
  # version = packaging/version.sh's MAJOR.MINOR.<commit count>. The build
  # job compiled with that version in Cargo.toml, so the binaries report
  # it. Non-prerelease, so the install scripts' /releases/latest/ tracks main and
  # older builds stay downloadable by tag. The publish-* jobs hang off this
  # one: nothing reaches a package manager until the release its download
  # URLs point at exists.
  # --------------------------------------------------------------------------
  release:
    name: Release
    # Everything must be green first. e2e only runs on the same push event
    # this job fires on, so this never waits on a run that will not happen.
    needs: [build, test, lint, e2e, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      # fetch-depth: 0 for the commit count. Checkout before
      # download-artifact, since it cleans the workspace.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(packaging/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing llmman $version as tag v$version"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: llmman-docker-*
          merge-multiple: false

      - name: Rename binaries for release
        shell: bash
        run: |
          cd dist
          for dir in */; do
            target="${dir%/}"          # e.g. llmman-docker-x86_64-unknown-linux-gnu
            triple="${target#llmman-docker-}"
            if [ -f "${dir}llmman.exe" ]; then
              cp "${dir}llmman.exe" "llmman-${triple}.exe"
            else
              cp "${dir}llmman" "llmman-${triple}"
            fi
          done

      # All five assets, by name, before anything is published, and the
      # one binary this runner can execute must report this version.
      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for asset in \
            llmman-x86_64-unknown-linux-gnu \
            llmman-aarch64-unknown-linux-gnu \
            llmman-aarch64-apple-darwin \
            llmman-x86_64-pc-windows-msvc.exe \
            llmman-aarch64-pc-windows-msvc.exe; do
            [ -s "$asset" ] || { echo "::error::release asset $asset is missing or empty"; exit 1; }
          done
          chmod +x llmman-x86_64-unknown-linux-gnu
          out="$(./llmman-x86_64-unknown-linux-gnu --version)"
          echo "$out"
          case "$out" in
          "llmman $VERSION ("*")") ;;
          *) echo "::error::binary reports \"$out\", expected \"llmman $VERSION (<commit>)\""; exit 1 ;;
          esac
          case "$out" in
          *-dirty*) echo "::error::release binary reports a dirty tree: $out"; exit 1 ;;
          esac

      # checksums.txt: a release asset for users, and (as an artifact) the
      # hashes publish-homebrew/publish-winget embed, so what brew/winget
      # enforce is the hash of the bytes uploaded here. Run from dist/ so
      # names are bare basenames, which render.sh expects.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -name 'llmman-*' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      # Two attempts, as for the binaries above.
      - name: Upload checksums artifact
        id: upload_checksums
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error
      - name: Upload checksums artifact (retry)
        if: steps.upload_checksums.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error
          overwrite: true

      - name: Build release notes
        id: notes
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$HEAD_COMMIT_MESSAGE" \
            | sed -E '/^[[:space:]]*(signed-off-by|co-authored-by):/Id' \
            | cat -s \
            | awk '
                { line[NR] = $0 }
                END {
                  last = NR
                  while (last > 0 && line[last] ~ /^[[:space:]]*-*[[:space:]]*$/) last--
                  for (i = 1; i <= last; i++) print line[i]
                }
              ' > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: |
            dist/llmman-*
            dist/checksums.txt

  # --------------------------------------------------------------------------
  # crates.io: the `llmman` crate at the same version, on every commit to
  # main. Versions are immutable there, which is fine: the commit count
  # never repeats. `cargo install llmman` builds from source (needs Go);
  # `cargo binstall llmman` fetches the release binary via Cargo.toml's
  # [package.metadata.binstall], whose v{ version } URL is this tag.
  # Needs secret CARGO_REGISTRY_TOKEN (publish-new + publish-update).
  # --------------------------------------------------------------------------
  publish-crate:
    name: Publish to crates.io
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set release version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          got="$(packaging/version.sh --apply)"
          [ "$got" = "$VERSION" ] || { echo "::error::version.sh gave $got here but $VERSION in the release job"; exit 1; }

      # `cargo publish` verifies by building the packaged crate, which
      # compiles the Go shim via CGO -- the only thing that proves the
      # .crate (with Cargo.toml's `exclude` applied) still builds.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install build dependencies
        run: sudo apt-get install -y gcc

      # Re-runs must not fail on crates.io's duplicate-version error. Only
      # an explicit 404 means "not published"; anything else (rate limit,
      # outage) fails here rather than guessing.
      - name: Skip if this version is already on crates.io
        id: exists
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            -H "User-Agent: llmman-ci (github.com/llmmanorg/llmman)" \
            "https://crates.io/api/v1/crates/llmman/$VERSION")"
          case "$code" in
          200) echo "::notice::llmman $VERSION is already published; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
          404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::crates.io returned HTTP $code for llmman $VERSION"; exit 1 ;;
          esac

      # --allow-dirty: the version edit above is uncommitted by design.
      - name: cargo publish
        if: steps.exists.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty

  # --------------------------------------------------------------------------
  # Homebrew (#385): macOS arm64, Linux x86_64/aarch64. Pushes the rendered
  # Formula/llmman.rb to llmmanorg/homebrew-tap, which needs
  # secrets.TAP_GITHUB_TOKEN (contents:write there). Users run
  # `brew install llmmanorg/tap/llmman`.
  # --------------------------------------------------------------------------
  publish-homebrew:
    name: Publish Homebrew formula
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Queue, never cancel: two close merges must not interleave their tap
    # pushes, and cancelling would drop an already-released version.
    concurrency:
      group: publish-homebrew
      cancel-in-progress: false
    steps:
      # persist-credentials: false -- only the tap checkout needs a token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-checksums

      - name: Render formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          packaging/render.sh \
            --version "$VERSION" \
            --checksums checksums.txt \
            --out-dir rendered

      - name: Check out the tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: llmmanorg/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag_name }}
          SRC: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "llmman-ci"
          git config user.email "llmman-ci@users.noreply.github.com"
          # symbolic-ref: rev-parse --abbrev-ref prints "HEAD" when detached.
          branch="$(git symbolic-ref --quiet --short HEAD || true)"
          if [ -z "$branch" ]; then
            branch="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          fi
          echo "Target branch: $branch"

          # The formula is generated output, so on a rejected push just
          # re-sync and regenerate on top rather than rebase.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$branch"
            git reset --quiet --hard FETCH_HEAD

            # Never move the tap backwards: two main pushes can finish out
            # of order, and a downgrade would hit every `brew upgrade`.
            if [ -f Formula/llmman.rb ]; then
              have="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/llmman.rb | head -n1)"
              if [ -n "$have" ] && [ "$have" != "$VERSION" ] \
                 && [ "$(printf '%s\n%s\n' "$have" "$VERSION" | sort -V | tail -n1)" = "$have" ]; then
                echo "::notice::tap already has llmman $have, newer than $VERSION; leaving it"
                exit 0
              fi
            fi

            mkdir -p Formula
            cp ../rendered/Formula/llmman.rb Formula/llmman.rb
            cp ../rendered/README.md README.md
            git add Formula README.md

            if git diff --cached --quiet; then
              echo "::notice::tap already up to date for $TAG"
              exit 0
            fi

            git commit --quiet -m "llmman $VERSION" \
              -m "Generated from llmmanorg/llmman@$SRC by packaging/render.sh."

            if git push --quiet origin "HEAD:$branch"; then
              echo "Pushed llmman $VERSION to the tap"
              exit 0
            fi
            echo "::warning::push to homebrew-tap rejected (attempt $attempt/5); re-syncing"
            sleep "$((attempt * 3))"
          done
          echo "::error::could not push llmman $VERSION to homebrew-tap after 5 attempts"
          exit 1

  # --------------------------------------------------------------------------
  # winget (#390): Windows x64/arm64. Every version is a PR against
  # microsoft/winget-pkgs, opened with Microsoft's wingetcreate (Windows
  # only) using secrets.WINGET_GITHUB_TOKEN, a PAT for an account that can
  # fork winget-pkgs. Their bot validates, a moderator merges. Users run
  # `winget install llmmanorg.llmman`.
  # --------------------------------------------------------------------------
  publish-winget:
    name: Publish winget manifest
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: publish-winget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-checksums

      - name: Render manifests
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          packaging/render.sh \
            --version "$VERSION" \
            --checksums checksums.txt \
            --out-dir rendered

      # Re-runs must not open a duplicate PR moderators have to close:
      # skip if the version is already merged or already has an open PR.
      - name: Skip if this version is already in winget-pkgs
        id: exists
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/l/llmmanorg/llmman/$VERSION" >/dev/null 2>&1; then
            echo "::notice::winget-pkgs already has llmman $VERSION; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          open="$(gh api "search/issues?q=repo:microsoft/winget-pkgs+is:pr+is:open+in:title+%22llmmanorg.llmman+version+$VERSION%22" --jq .total_count)"
          if [ "$open" != "0" ]; then
            echo "::notice::an open winget-pkgs PR for llmman $VERSION already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Pinned release + checksum, not aka.ms/wingetcreate/latest: this
      # binary runs with a PAT in its environment.
      - name: Install wingetcreate
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        env:
          WINGETCREATE_VERSION: v1.12.13.0
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
          $got = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($got -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe sha256 $got != $env:WINGETCREATE_SHA256" }
          # Smoke test. `info` is the only real "print the version" command:
          # `version` and `help` are listed in the help text by
          # CommandLineParser but are not registered verbs, so they (like
          # `--version`) print help and exit 1. `info` also skips the GitHub
          # client, so it needs no token or network.
          .\wingetcreate.exe info
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate info failed with exit code $LASTEXITCODE" }

      # WINGET_CREATE_GITHUB_TOKEN is wingetcreate's env var for CI
      # (https://aka.ms/winget-create-token); --token may be logged.
      - name: Submit to microsoft/winget-pkgs
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "rendered/manifests/l/llmmanorg/llmman/$env:VERSION"
          Get-ChildItem $dir
          .\wingetcreate.exe submit $dir
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed with exit code $LASTEXITCODE" }
