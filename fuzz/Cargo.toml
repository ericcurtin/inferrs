[package]
name = "llmman-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.llmman]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "parse_registry_ref"
path = "fuzz_targets/parse_registry_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_reference"
path = "fuzz_targets/validate_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_ollama_api"
path = "fuzz_targets/resolve_ollama_api.rs"
test = false
doc = false
bench = false
